name: Deploy PCR Dashboard

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: 970a18824ff9bb3782f19d6aba59d97392f98961c8a8a1739778ed0bfa9578e507-2d5439f5-05d3-43ee-8d86-ded541795f0201022190b4125b10
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          skip_app_build: true