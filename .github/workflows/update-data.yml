name: Update PCR Data

# Power Automate creates a GitHub issue titled DATA_UPDATE whose body is the
# current PCR records as JSON. This workflow reads that issue, writes data.json,
# commits it, deploys to Azure, then closes the issue.
# (We use an issue instead of repository_dispatch because the Power Automate
#  GitHub connector's dispatch action returns 404 — a known connector bug.)
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Only one update may run at a time; queue the rest so they don't race on git push.
concurrency:
  group: update-pcr-data
  cancel-in-progress: false

jobs:
  update_and_deploy:
    if: github.event.issue.title == 'DATA_UPDATE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write data.json from issue body
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'PY'
          import json, os
          raw = os.environ['BODY'].strip()
          data = json.loads(raw)
          # If the body arrived as a JSON string, unwrap it once.
          if isinstance(data, str):
              data = json.loads(data)
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, separators=(',', ':'))
          print('Wrote', len(data), 'records to data.json')
          PY

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update PCR data [skip ci]"
          git push

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          skip_app_build: true

      - name: Close the update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Dashboard updated automatically."
