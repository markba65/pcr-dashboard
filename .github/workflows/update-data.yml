name: Update PCR Data

# Power Automate creates a GitHub issue titled DATA_UPDATE whose body is the
# current PCR records as JSON. This workflow reads that issue, writes data.json,
# commits it, deploys to Azure, then closes the issue.
# (We use an issue instead of repository_dispatch because the Power Automate
#  GitHub connector's dispatch action returns 404 — a known connector bug.)
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Only one update may run at a time; queue the rest so they don't race on git push.
concurrency:
  group: update-pcr-data
  cancel-in-progress: false

jobs:
  update_and_deploy:
    if: github.event.issue.title == 'DATA_UPDATE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write data.json from issue body
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - << 'PY'
          import json, os
          raw = os.environ['BODY'].strip()
          data = json.loads(raw)
          # If the body arrived as a JSON string, unwrap it once.
          if isinstance(data, str):
              data = json.loads(data)
          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, separators=(',', ':'))
          print('Wrote', len(data), 'records to data.json')
          PY

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update PCR data [skip ci]"
          git push

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          skip_app_build: true

      - name: Close the update issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 - << 'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          issue_number = os.environ["ISSUE_NUMBER"]

          def api_call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      response.read()  # We only need success/failure; body content is not used.
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API call failed ({method} {path}) with status {exc.code}: {details}"
                  ) from exc

          api_call("POST", f"/issues/{issue_number}/comments", {"body": "Dashboard updated automatically."})
          api_call("PATCH", f"/issues/{issue_number}", {"state": "closed"})
          print(f"Closed issue #{issue_number}")
          PY
